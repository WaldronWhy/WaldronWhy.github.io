baseURL = "https://waldronwhy.github.io/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
title = "小澍's Blog"
paginate = 7
theme = "PaperMod"

[params]
  author = "小澍"
  description = "小澍的技术随笔 · 大模型 / AIGC / 算法工程"
  # 默认暗色，符合你之前的风格
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  hideFooter = false
  # 把 “Labels” 改成中文
  labels.text = "标签"
  # 日期显示为中文（如 2026年09月01日）
  DateFormat = "2006年01月02日"

  # 首页个人卡片（头像 + 名字 + 简介 + 社交 + 按钮）
  [params.profileMode]
    enabled = true
    title = "小澍"
    subtitle = "关注大模型 / AIGC / 算法工程"
    # 首页两个按钮
    [[params.profileMode.buttons]]
      name = "阅读文章"
      url = "/posts/"
    [[params.profileMode.buttons]]
      name = "关于我"
      url = "/about/"

  # 社交链接（页脚/首页展示，按需删改）
  [params.social]
    github = "https://github.com/WaldronWhy"

  # 资源（favicon 等）
  [params.assets]
    favicon = "/favicon.svg"
    theme_color = "#0f1115"

# 开启站内搜索（需 JSON 输出）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 顶部导航
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 50
